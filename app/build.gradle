plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xitomods.panel'
    compileSdk 34

    defaultConfig {
        applicationId "com.xitomods.panel"
        minSdk 21
        targetSdk 34
        versionCode 40
        versionName "4.0-NEON"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Pure Android SDK (zero external dependencies required, matching original APK)
}
