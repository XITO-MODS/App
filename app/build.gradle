plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xito.aurorapanel'
    compileSdk 34

    defaultConfig {
        applicationId "com.xito.aurorapanel"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "3.0-RGB-Dual"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            minifyEnabled false
        }
    }

    // Evita que Android comprima los bundles RGB y archivos de bypass de FF Normal y FF MAX
    androidResources {
        noCompress 'RGB_NORMAL', 'BYPASS_NORMAL', 'ORIFILEINFO_NORMAL', 'RGB_MAX', 'BYPASS_MAX', 'ORIFILEINFO_MAX'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
